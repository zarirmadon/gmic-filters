# STREAMING_CHUNK:Configuring GitHub Action workflow triggers
name: Auto Update README Directory

on:
  push:
    branches:
      - main
  workflow_dispatch:

# STREAMING_CHUNK:Setting permissions for GitHub token
permissions:
  contents: write

# STREAMING_CHUNK:Defining workflow job steps
jobs:
  update-directory:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run README directory generator script
        run: python scripts/update_readme.py

      - name: Commit and push updated README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update plugin directory in README.md [skip ci]"
          file_pattern: "README.md"