name: Update Filter Index

on:
  push:
    branches: [main]
    paths:
      - "*/README.md"
      - ".github/scripts/build_filter_index.py"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: filter-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Rebuild filter catalogue
        run: python .github/scripts/build_filter_index.py
      - name: Commit catalogue if changed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Filter catalogue is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update filter index"
          git push
