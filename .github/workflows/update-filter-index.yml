name: Update Filter Index

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout G'MIC filters
        uses: actions/checkout@v4

      - name: Checkout official KDE Breeze Icons
        uses: actions/checkout@v4
        with:
          repository: KDE/breeze-icons
          path: .breeze-icons
          fetch-depth: 1

      - name: Build filter index
        run: python .github/scripts/build_filter_index.py

      - name: Remove temporary Breeze checkout
        run: rm -rf .breeze-icons

      - name: Commit generated catalogue
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Filter index already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md .github/assets
          git commit -m "Update filter index"
          git push
