name: Update Filter Index

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build filter index
        run: python .github/scripts/build_filter_index.py

      - name: Commit updated index
        run: |
          if git diff --quiet; then
            echo "Filter index already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Update filter index"
          git push
